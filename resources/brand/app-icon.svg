      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>
    <linearGradient id="ringUpper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#22EFD8" />
    </linearGradient>
    <linearGradient id="ringLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="packetCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
