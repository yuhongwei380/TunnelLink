      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <filter id="ringShadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="streamGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dy="2" result="offsetBlur" />
      <feFlood flood-color="#22D3EE" flood-opacity="0.2" result="glowColor" />
      <feComposite in="glowColor" in2="offsetBlur" operator="in" result="softGlow" />
      <feMerge>
